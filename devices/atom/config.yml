# devices/atom/config.yml
# Device configuration for atom - Field Hacker Workstation (Basecamp Node)
#
# Converted from headless resilience node 2025-12
# Form factor: ThinkPad X1 Carbon - portable, battery-backed, keyboard-centric

device:
  hostname: atom
  fqdn: atom.pangolin-vega.ts.net
  os: Fedora 43 Server
  codename: basecamp
  desktop_environment: sway  # Tiling Wayland compositor
  type: Field Hacker Workstation (Basecamp Node)

  roles:
    - basecamp_node
    - hacker_workstation
    - portable

  flags:
    basecamp: true
    headless: false
    battery_backed: true
    portable: true
    sdr_enabled: true
    lora_enabled: true

  hardware:
    manufacturer: Lenovo
    model: ThinkPad X1 Carbon (1st Gen, 2012)
    cpu: Intel Core i7-3667U
    cpu_cores: 2
    cpu_threads: 4
    gpu: Intel HD Graphics 4000 (integrated)
    gpu_compute_capable: false
    memory_gb: 8
    storage:
      - device: sda
        model: Internal SSD
        size_gb: 224
        type: SSD
        purpose: Boot + OS
        partitions:
          - mount: /
            filesystem: ext4
    battery: true
    battery_notes: |
      New battery purchased - enables extended field operations.
      ThinkPad form factor is ideal: TrackPoint nub, excellent keyboard,
      and robust build quality for field work.
    input:
      trackpoint: true  # ThinkPad nub - essential for field use
      keyboard: thinkpad  # Excellent typing experience

  operating_system:
    os: Fedora
    version: "43"
    codename: server
    kernel: "6.x"
    desktop_environment: sway
    display_server: wayland
    display_manager: greetd
    boot_target: graphical.target

  network:
    tailscale:
      enabled: true
      hostname: atom
      ip: 100.120.122.13
      tags:
        - tag:server
        - tag:linux
        - tag:basecamp
        - tag:portable
      auth_key_akv_secret: tailscale-auth-key-atom
    ssh:
      enabled: true
      auth: key_only
      tailnet_only: true
      port: 22
    firewall: firewalld
    firewall_policy: tailnet-only

  services:
    - tailscaled          # Tailscale daemon
    - firewalld           # Firewall
    - prometheus-node-exporter  # Metrics for Prometheus
    - sshd                # SSH server
    - greetd              # Display manager for Sway
    # NOT running:
    # - pihole-FTL (removed - not needed)
    # - nxserver (removed - SSH only)
    # - cups (removed - no printing)
    # - podman/docker (not a container host)
    # - vllm/litellm (no GPU compute)

  monitoring:
    node_exporter:
      enabled: true
      port: 9100

  power:
    battery:
      low_warning_percent: 5
      critical_percent: 2
      critical_action: shutdown
    lid_switch: ignore      # Keep running with lid closed
    idle_action: ignore     # Never sleep during field ops
    suspend: masked         # Prevent all suspend/hibernate

  filesystem:
    notes: |
      Basecamp nodes do NOT mount /space, /flux, or /time.
      Zero external dependencies = reliable field operations.
      Use SSH/SCP for on-demand data transfer.

  selinux:
    mode: permissive  # Flexibility for security research tools
    notes: |
      Permissive mode allows security research tools to function
      without constant policy exceptions. Acceptable risk for a
      field device only accessible via tailnet.

  accounts:
    automation: mdt
    interactive:
      - mdt  # Primary user for field operations

  security:
    ssh_tailnet_only: true
    no_lan_ssh: true
    firewall_zones:
      public: []
      tailnet:
        - ssh
        - node-exporter

  hacker_tools:
    sdr:
      enabled: true
      packages:
        - rtl-sdr
        - gqrx
        - gnuradio
      notes: RTL-SDR support for RF analysis
    lora:
      enabled: true
      notes: LoRa development and packet sniffing
    network:
      enabled: true
      packages:
        - wireshark-cli  # tshark for packet capture
        - nmap
        - aircrack-ng
    serial:
      enabled: true
      notes: USB-to-serial for embedded device hacking

notes: |
  atom - Field Hacker Workstation (Basecamp Node)

  ═══════════════════════════════════════════════════════════════
  CORE MISSION: Portable (ethical) hacking platform for field ops
  ═══════════════════════════════════════════════════════════════

  Why ThinkPad X1 Carbon (2012)?
    - TrackPoint nub: Precise control without leaving home row
    - Legendary keyboard: Essential for extended field sessions
    - Battery-backed: Hours of operation without wall power
    - Lightweight: Easy to carry in the field
    - Robust: Survives real-world conditions

  Design Principles:
    - Sway (Wayland): Lightweight, keyboard-driven, efficient
    - Minimal services: Maximize battery life
    - Zero network dependencies: Works offline/airgapped
    - Tailnet-only access: Secure remote management
    - 100% IaC/CaC: Reproducible configuration

  What This Device DOES:
    ✓ SDR/RF analysis (RTL-SDR, gqrx)
    ✓ LoRa development and sniffing
    ✓ Network analysis (wireshark, nmap)
    ✓ Serial/embedded device hacking
    ✓ Pi-hole DNS filtering (portable)
    ✓ SSH foothold for field operations

  What This Device Does NOT Do:
    ✗ Container hosting (not enough RAM)
    ✗ AI/LLM workloads (no GPU compute)
    ✗ Heavy GUI applications (SDRangel, VS Code)
    ✗ Network storage mounts

  Access:
    - SSH: ssh atom.pangolin-vega.ts.net (tailnet only)
    - Desktop: Sway via greetd (local console)
    - Metrics: http://atom.pangolin-vega.ts.net:9100/metrics


