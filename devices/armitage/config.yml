# Armitage - Windows 11 Pro Gaming Laptop
# Last Updated: 2026-11-02
#
# History: Windows 11 -> Fedora KDE (2025-12-20) -> Windows 11 Pro (2026-11).
# Why: the box is primarily a gaming/peripheral machine (DualSense Edge, Xbox Elite 2,
# Denuvo titles, hybrid Intel/NVIDIA graphics). Every hardware-specific problem on Fedora
# was a Linux-on-hybrid-laptop problem that does not exist on Windows.
# See docs/communications/COMMUNICATION_LOG.md (2026-11-02).
#
# Architecture References:
#   - ADR-004: KDE Plasma is the Linux UI standard; armitage is a Windows exception (like wintermute)
#   - ADR-005: no local LLM runtime on this node since 2026-11 (LiteLLM client only)
#   - AI_FABRIC_SERVICE.md / AI_FABRIC_PLATFORM_CONTRACT.md

device:
  hostname: armitage
  type: laptop
  location: mobile
  primary_user: mdt

  # Device classification
  roles:
    - windows_workstation
    - gpu_node
    - cuda_development
    - gaming

hardware:
  manufacturer: Alienware
  model: m16 R2
  cpu: Intel Core Ultra 7 155H (16 cores, 22 threads)
  igpu: Intel Arc (Meteor Lake) - primary display adapter
  gpu: NVIDIA GeForce RTX 4070 Laptop (8GB VRAM, CUDA capable)
  gpu_driver: latest
  memory: 32GB DDR5
  storage:
    - 1TB NVMe SSD (Primary - Windows + data)

operating_system:
  os: Windows 11 Pro
  version: Latest
  wsl: true
  docker_desktop: false     # BANNED
  podman_desktop: false     # no container runtime on armitage (2026-11-02)
  local_account_only: true  # No Microsoft account; local admin 'mdt' is the automation account

network:
  tailscale_enabled: true
  tailscale_hostname: armitage.pangolin-vega.ts.net
  tailscale_tags:
    - workstation
    - windows
    - gaming
  tailscale_ssh: false      # Windows: managed via WinRM (5985) + OpenSSH server
  remote_desktop: nomachine
  wake_on_lan: true

management:
  ansible_connection: winrm
  ansible_password_secret: armitage-ansible-password   # Azure Key Vault (kv-miket-ops)
  bootstrap: "autounattend.xml + firstlogon.ps1 (WinRM, Tailscale, OpenSSH, product key) at install time"

services:
  - NVIDIA CUDA Toolkit
  - NoMachine (remote desktop)
  - OpenSSH Server
  - windows_exporter (Prometheus, :9182)
  - Steam / Heroic / Xbox app (gaming)

# No local LLM runtime (Ollama dropped 2026-11). LLM access goes through the
# LiteLLM gateway on akira:4000 (ASK_BASE_URL), like every other client node.
ollama:
  enabled: false

use_cases:
  - Gaming (primary) with native controller and peripheral support
  - LLM access via the LiteLLM gateway on akira (no local models)
  - Mobile development workstation (WSL2 + chezmoi)
  - CUDA/ML development
  - Remote access via Tailscale

notes:
  - Alienware m16 R2 with hybrid Intel Arc iGPU + RTX 4070 Laptop
  - Local admin account 'mdt' only; activated with a user-supplied Windows 11 Pro key (firmware OEM key unused)
  - Managed like wintermute: WinRM over Tailscale, Windows playbooks in ansible/playbooks/*-windows.yml
  - Fedora-era playbooks archived under docs/archive/ansible-playbooks/
