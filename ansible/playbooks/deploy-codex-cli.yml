---
# Compatibility entrypoint for deploying OpenAI Codex CLI to workstations.
# The ai_workstation_tools role is the authoritative implementation.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/deploy-codex-cli.yml
#
#   # Deploy to specific host
#   ansible-playbook -i inventory/hosts.yml playbooks/deploy-codex-cli.yml --limit akira
#
#   # Test with timeout
#   timeout 300 ansible-playbook -i inventory/hosts.yml playbooks/deploy-codex-cli.yml --limit akira

- name: Deploy OpenAI Codex CLI
  hosts: all_workstations
  gather_facts: yes
  
  pre_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Deploying Codex CLI to {{ inventory_hostname }}
          - OS: {{ ansible_os_family }}
          - Installer is selected by the standard AI workstation role
  
  roles:
    - role: codex_cli
  
  post_tasks:
    - name: Deployment complete
      ansible.builtin.debug:
        msg: |
          ✅ Codex CLI deployment complete on {{ inventory_hostname }}!
          - Run 'codex' to authenticate and start using
          - Run 'codex' as the interactive workstation user
