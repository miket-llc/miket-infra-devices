---
# Close Fedora Workstation's default 1025-65535 LAN exposure (see role defaults).
#   ansible-playbook -i inventory/hosts.yml playbooks/harden-lan-firewall.yml --check --diff
- name: Harden LAN firewall on Fedora hosts
  hosts: linux
  become: true
  roles:
    - role: ../roles/firewalld_lan_lockdown

# Root podman port-forwards (netavark DNAT) bypass firewalld zones, so closing the
# zone does not hide containers published on 0.0.0.0. liferpg-db is a hand-made
# `podman generate systemd` unit (no role yet); bind it to loopback -- life-rpg
# connects via localhost:5433.
- name: Bind liferpg-db to loopback
  hosts: akira
  become: true
  tasks:
    - name: Publish liferpg-db on 127.0.0.1 only
      ansible.builtin.replace:
        path: /etc/systemd/system/liferpg-db.service
        regexp: '-p 5433:5432'
        replace: '-p 127.0.0.1:5433:5432'
      register: liferpg_db_unit

    - name: Restart liferpg-db with the new binding
      ansible.builtin.systemd:
        name: liferpg-db.service
        daemon_reload: true
        state: restarted
      when: liferpg_db_unit.changed

# macOS application firewall was found disabled on count-zero (2026-10-22).
# Signed built-in services (sshd/Remote Login) and Tailscale's network extension
# keep working; stealth mode drops unsolicited probes on the LAN.
- name: Enable macOS application firewall
  hosts: macos
  gather_facts: false
  vars:
    # count-zero sets ansible_become: false at host level, which beats the play
    # keyword; play vars outrank inventory host vars.
    ansible_become: true
  tasks:
    - name: Read firewall state
      ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate --getstealthmode --getallowsigned
      register: macos_fw
      changed_when: false
      check_mode: false

    - name: Turn on firewall, stealth mode, allow signed built-ins
      ansible.builtin.command: "/usr/libexec/ApplicationFirewall/socketfilterfw {{ item.flag }}"
      loop:
        - { flag: "--setglobalstate on", done: "Firewall is enabled" }
        - { flag: "--setstealthmode on", done: "Stealth mode enabled" }
        - { flag: "--setallowsigned on", done: "built-in software ENABLED" }
      when: item.done not in macos_fw.stdout
