# ansible/host_vars/armitage.yml
#
# Host-specific variables for armitage
# Alienware m16 R2 gaming laptop - Windows 11 Pro gaming/dev workstation
#
# History: Windows 11 -> Fedora KDE (2025-12) -> Windows 11 Pro (2026-11).
# Rationale and migration notes: docs/communications/COMMUNICATION_LOG.md (2026-11-02).
#
# Architecture References:
#   - ADR-004: KDE Plasma is the Linux UI standard; armitage is a Windows exception (like wintermute)
#   - ADR-005: no local LLM runtime on this node since 2026-11; akira is the vLLM/LiteLLM server
#   - AI_FABRIC_SERVICE.md / AI_FABRIC_PLATFORM_CONTRACT.md: node topology and ports

---
# =============================================================================
# Hardware and OS profile
# =============================================================================
hardware:
  vendor: "Alienware"
  model: "m16 R2"
  cpu:
    model: "Intel Core Ultra 7 155H"
    cores: 16
    threads: 22
  gpu:
    vendor: "NVIDIA"
    model: "GeForce RTX 4070 Laptop"
    vram_gb: 8
    driver_version: "latest"
    cuda_capable: true
  # Hybrid graphics: the Intel Arc iGPU (Meteor Lake) is the primary display adapter.
  igpu: "Intel Arc (Meteor Lake)"
  memory_gb: 32
  storage:
    - type: "NVMe SSD"
      size_gb: 1024
      purpose: "Primary OS and data"
network:
  tailscale:
    enabled: true
    hostname: "armitage"
os:
  name: "Windows"
  version: "11"
  edition: "Pro"
device_roles:
  - windows-workstation
  - gaming-mode
  - cuda-development

# No container runtime on armitage (decided 2026-11-02); overrides the windows_workstations default.
podman_desktop:
  enabled: false

# =============================================================================
# Identity & Network
# =============================================================================
hostname: armitage
tailscale_hostname: armitage
# Must match miket-infra ACL tagOwners (platform-owned)
tailscale_tags:
  - "tag:workstation"
  - "tag:windows"
  - "tag:gaming"

# Remote desktop: NoMachine is the fleet standard (RDP retired 2025-11-22)
remote_protocol: nomachine
remote_port: 4000
restrict_to_tailscale: true
nomachine_version: "9.2.18"
nomachine_port: 4000

# =============================================================================
# GPU / AI Configuration
# =============================================================================
gpu_vendor: NVIDIA
gpu_model: "GeForce RTX 4070 Laptop"
gpu_vram_gb: 8
enable_nvidia: true
enable_cuda: true
enable_rocm: false

# vLLM is NOT run on this node (ADR-005 workstation pattern).
# deploy-vllm-windows.yml ends the play for hosts with vllm.enabled false.
vllm:
  enabled: false

# =============================================================================
# LLM: none on this node (2026-11)
# =============================================================================
# armitage consumes the LiteLLM gateway on akira:4000 like every other client
# (llm_client_nodes). No Ollama, no vLLM.
ollama_enabled: false
llm_gateway_enabled: false

# =============================================================================
# Monitoring
# =============================================================================
# Windows hosts run windows_exporter (:9182), not node_exporter
node_exporter_enabled: false
windows_exporter_enabled: true

# Windows hosts don't use become/sudo; management is WinRM (see inventory).
