---
# Compatibility wrapper for older playbooks that still call codex_cli.
- name: Install Codex through the standard AI workstation role
  ansible.builtin.include_role:
    name: ai_workstation_tools
  vars:
    ai_workstation_tools_chatgpt_enabled: false
    ai_workstation_tools_codex_enabled: true
    ai_workstation_tools_claude_code_enabled: false
    ai_workstation_tools_update: "{{ codex_cli_update | bool }}"
