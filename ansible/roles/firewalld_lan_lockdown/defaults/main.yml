---
# Fedora Workstation ships its default zone with 1025-65535/tcp+udp open to every
# LAN interface. On akira that exposed Grafana, Prometheus, LiteLLM, Postgres,
# OpenSearch etc. to anything on the home network. tailscale0 sits in the
# `trusted` zone, so tailnet access is unaffected by closing the range.
firewalld_lan_zone: FedoraWorkstation
firewalld_lan_closed_ports:
  - 1025-65535/tcp
  - 1025-65535/udp
# What remains reachable from the LAN (high ports are tailnet-only).
firewalld_lan_services:
  - ssh
  - samba
  - samba-client
  - dhcpv6-client
  - mdns
  - kdeconnect
